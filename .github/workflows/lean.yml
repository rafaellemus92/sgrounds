name: Lean proofs

on:
  push:
    paths: ["experiments/wyrd/**", ".github/workflows/lean.yml"]
  pull_request:
    paths: ["experiments/wyrd/**", ".github/workflows/lean.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: experiments/wyrd
      - name: Audit axioms (no sorry, no native_decide)
        working-directory: experiments/wyrd
        run: |
          lake env lean Audit.lean | tee audit.txt
          if grep -E "sorryAx|ofReduceBool" audit.txt; then
            echo "::error::A theorem depends on sorry or on trusting compiled code"
            exit 1
          fi
